<div class="container">
  <!-- Tela de Login -->
  <div class="login-card" id="login-form">
    <h2>Login</h2>
    
    <label for="cpf">CPF</label>
    <input type="text" id="cpf" placeholder="Digite seu CPF">
    
    <label for="password">Senha</label>
    <input type="password" id="password" placeholder="Digite sua senha">
    
    <button onclick="handleLogin()">Entrar</button>
    
    <div class="links">
      <a href="#" onclick="showRecoveryForm()">Esqueceu sua senha?</a>
      <a href="#" onclick="showRegisterForm()">Cadastrar conta</a>
    </div>
  </div>

  <!-- Tela de Recuperação de Senha -->
  <div class="login-card" id="recovery-form" style="display: none;">
    <h2>Recuperar Senha</h2>
    
    <label for="recovery-cpf">CPF</label>
    <input type="text" id="recovery-cpf" placeholder="Digite seu CPF">
    
    <button onclick="sendRecoveryCode()">Enviar Código</button>
    
    <div class="links">
      <a href="#" onclick="showLoginForm()">Voltar ao login</a>
    </div>
  </div>

  <!-- Tela de Cadastro -->
  <div class="login-card" id="register-form" style="display: none;">
    <h2>Cadastrar Conta</h2>

    <label for="register-name">Nome</label>
    <input type="text" id="register-name" placeholder="Digite seu nome">

    <label for="register-cpf">CPF</label>
    <input type="text" id="register-cpf" placeholder="Digite seu CPF">

    <label for="register-email">E-mail</label>
    <input type="email" id="register-email" placeholder="Digite seu e-mail">

    <label for="register-password">Senha</label>
    <input type="password" id="register-password" placeholder="Digite sua senha">

    <button onclick="registerAccount()">Cadastrar</button>

    <div class="links">
      <a href="#" onclick="showLoginForm()">Já tem uma conta? Faça login</a>
    </div>
  </div>
</div>
